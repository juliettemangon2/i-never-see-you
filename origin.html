<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>cycle 0 — i never see you</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://ineverseeyou.com/cycle0" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        img {
            display: block;
        }

        /* Full-viewport background, cropped (never stretched) and centered */
        .stage {
            position: fixed;
            inset: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4vw;
            padding: 0 4vw;
            background: #000 url("cycle0/homepage/background.png") center / cover no-repeat;
        }

        /* Title over the top of the stage; white text with a black outline */
        .title {
            position: fixed;
            top: max(3vh, env(safe-area-inset-top));
            left: 0;
            right: 0;
            z-index: 2;
            padding: 2rem;
            text-align: center;
            font-size: clamp(1rem, 5vw, 3rem);
            line-height: 1.1;
            color: #fff;
            -webkit-text-stroke: clamp(1px, 0.08em, 4px) #000;
            paint-order: stroke fill;
            pointer-events: none;
            letter-spacing: 0.01em;
            font-weight: 500;
        }

        /* Two slots; each figure stands on the bottom edge of its slot */
        .slot {
            display: flex;
            align-items: flex-end;
            min-width: 0;
            container-type: inline-size;
        }

        .slot--left {
            justify-content: flex-start;
            padding-left: 8vw;
            padding-bottom: 6vh;
        }

        .slot--right {
            justify-content: flex-end;
            padding-right: 6vw;
            padding-bottom: 6vh;
        }

        /*
         * Pandora figure: a base image with a lid stacked on top.
         * All numbers are pixels in the source PNGs, so everything scales together.
         *   --canvas-w / --canvas-h : size of the base (girl) image
         *   --lid-x / --lid-y / --lid-w : where the lid PNG sits on that canvas
         * Each figure also sets --lid-closed / --lid-open (the lid's transform in each state).
         */
        .pandora {
            position: relative;
            display: block;
            flex: none;
            height: 70vh;
            height: min(70svh, calc(100cqw * var(--canvas-h) / var(--canvas-w)));
            aspect-ratio: var(--canvas-w) / var(--canvas-h);
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .pandora:focus-visible {
            outline-offset: 6px;
        }

        .pandora__base,
        .pandora__lid-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .pandora__lid-layer {
            transform: var(--lid-closed, none);
            transition: transform 0.6s ease-out;
        }

        .pandora__lid {
            position: absolute;
            left: calc(var(--lid-x) / var(--canvas-w) * 100%);
            top: calc(var(--lid-y) / var(--canvas-h) * 100%);
            width: calc(var(--lid-w) / var(--canvas-w) * 100%);
            height: auto;
        }

        .pandora.is-open .pandora__lid-layer {
            transform: var(--lid-open);
        }

        /* Left: lid slides up. translateY % is relative to the lid layer, which is the full image height */
        .pandora--1 {
            --canvas-w: 1837;
            --canvas-h: 6115;
            --lid-x: 32;
            --lid-y: 1346;
            --lid-w: 611;
            --lift: 500;
            --lid-open: translateY(calc(var(--lift) / var(--canvas-h) * -100%));
        }

        /*
         * Right: lid rotates on a hinge at the back corner of the box.
         * The lid PNG is drawn open, so it starts rotated down by --angle and rotates back to 0.
         */
        .pandora--2 {
            --canvas-w: 3338;
            --canvas-h: 4689;
            --lid-x: 2254;
            --lid-y: -686;
            --lid-w: 1006;
            --hinge-x: 3234;
            --hinge-y: 569;
            --angle: 38deg;
            --lid-closed: rotate(calc(var(--angle) * -1));
            --lid-open: rotate(0deg);
        }

        /* Lid sits behind the girl so her fingers stay in front of it */
        .pandora--2 .pandora__base {
            z-index: 1;
        }

        .pandora--2 .pandora__lid-layer {
            transform-origin: calc(var(--hinge-x) / var(--canvas-w) * 100%) calc(var(--hinge-y) / var(--canvas-h) * 100%);
        }

        @media (prefers-reduced-motion: reduce) {
            .pandora__lid-layer {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <h1 class="title">pick your poison...</h1>

    <main class="stage">
        <div class="slot slot--left">
            <a class="pandora pandora--1" href="sequence.html" aria-label="Open Pandora's box">
                <img class="pandora__base" src="cycle0/homepage/pandoras-box-1-girl.png" alt="" draggable="false">
                <span class="pandora__lid-layer">
                    <img class="pandora__lid" src="cycle0/homepage/pandoras-box-1-lid.png" alt="" draggable="false">
                </span>
            </a>
        </div>

        <div class="slot slot--right">
            <a class="pandora pandora--2" href="carousel.html" aria-label="Open Pandora's box">
                <img class="pandora__base" src="cycle0/homepage/pandoras-box-2-girl.png" alt="" draggable="false">
                <span class="pandora__lid-layer">
                    <img class="pandora__lid" src="cycle0/homepage/pandoras-box-2-lid.png" alt="" draggable="false">
                </span>
            </a>
        </div>
    </main>

    <script>
        const PAUSE_MS = 300;
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        let leaving = false;

        function open(figure) {
            leaving = true;
            const go = () => { window.location.href = figure.href; };

            if (reduceMotion.matches) {
                go();
                return;
            }

            const lid = figure.querySelector('.pandora__lid-layer');
            let done = false;
            const finish = () => {
                if (done) return;
                done = true;
                setTimeout(go, PAUSE_MS);
            };

            lid.addEventListener('transitionend', (e) => {
                if (e.target === lid && e.propertyName === 'transform') finish();
            });
            setTimeout(finish, 1000); // in case transitionend never fires

            figure.classList.add('is-open');
        }

        document.querySelectorAll('.pandora').forEach((figure) => {
            figure.addEventListener('click', (e) => {
                // Let cmd/ctrl/shift-click open the link normally
                if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
                e.preventDefault();
                if (!leaving) open(figure);
            });
        });

        // Coming back via the back button restores this page from cache; close the box again
        window.addEventListener('pageshow', (e) => {
            if (!e.persisted) return;
            leaving = false;
            document.querySelectorAll('.pandora.is-open').forEach((f) => f.classList.remove('is-open'));
        });
    </script>

</body>

</html>
