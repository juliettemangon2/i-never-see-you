    <style>
        :root {
            --pink: #ff92d3;
            --magenta: #ff00ff;
            --black: #000;
            --red: #000000;
            --gray: #e4ebf6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: var(--gray);
            color: var(--red);
            font-family: "parabolica", sans-serif;
        }

        body {
            position: relative;
        }

        a {
            color: var(--red);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .page {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 3rem 1.5rem 2rem;
            position: relative;
            z-index: 10;
            background: var(--gray);
        }

        .container {
            width: 100%;
            text-align: justify;
        }

        h1 {
            font-size: clamp(1rem, 2vw, 2rem);
            line-height: 1.05;
            margin-bottom: 0;
            font-weight: 400;
            text-align: center;
        }



        .nav-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0;
            margin-bottom: 0;
        }

        .nav-buttons a {
            width: 7rem;
            height: 7rem;
            border: 4px solid var(--red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: var(--red);
            font-size: 1.3rem;
            line-height: 1;
            text-align: center;
            padding: 0.75rem;
            font-weight: 500;
            transition: transform 0.2s ease, background-color 0.2s ease;
            margin: 0 -1.5rem;
        }

        .nav-buttons a:hover {
            text-decoration: none;
        }

        .side-links {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 20;
        }

        .side-links ul {
            list-style: none;
            display: flex;
            gap: 1.25rem;
        }

        .side-links a {
            color: var(--red);
            text-decoration: none;
            font-size: 1rem;
            line-height: 1;
            white-space: nowrap;
        }

        .side-links a:hover {
            text-decoration: underline;
        }

        .side-links.left {
            left: 0.5rem;
        }

        .side-links.right {
            right: 0.5rem;
        }

        .side-links.left ul,
        .side-links.right ul {
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }

        .mobile-links {
            display: none;
            margin-top: 2rem;
        }

        .mobile-links ul {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem 1.25rem;
        }

        .mobile-links li {
            min-width: 0;
        }

        .mobile-links a {
            display: block;
            font-size: 1rem;
            line-height: 1.2;
            word-break: break-word;
        }

        body {
            position: relative;
            overflow-x: hidden;
        }

        @media (max-width: 1100px) {
            .side-links {
                display: none;
            }

            .mobile-links {
                display: block;
                text-align: left;
            }

            .container {
                max-width: 900px;
            }
        }

        @media (max-width: 700px) {
            .page {
                padding: 2rem 1rem 3rem;
            }

            h1 {
                font-size: clamp(0.9rem, 5vw, 1rem);
                margin-bottom: 1rem;
            }

            .nav-buttons {
                gap: 0;
                margin-bottom: 2.25rem;
            }

            .nav-buttons a {
                border: 2px solid var(--red);

                width: 8rem;
                height: 8rem;
                font-size: 0.95rem;
                padding: 0.6rem;
                margin: 0 -1rem;
            }

            .mobile-links ul {
                gap: 0.85rem 1rem;
            }

            .mobile-links a {
                font-size: 0.95rem;
            }
        }

        @media (max-width: 420px) {
            .mobile-links ul {
                grid-template-columns: 1fr 1fr;
            }

            .nav-buttons a {

                font-size: 0.85rem;
                margin: 0 -0.75rem;
            }
        }
    </style>
</head>
